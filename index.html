<script>
/* ================= PURE START ================= */
function emaS(values, period){
  const out = new Array(values.length).fill(null);
  if(values.length < period) return out;
  let sum = 0;
  for(let i=0;i<period;i++) sum += values[i];
  let prev = sum/period;
  out[period-1] = prev;
  const k = 2/(period+1);
  for(let i=period;i<values.length;i++){
    prev = values[i]*k + prev*(1-k);
    out[i] = prev;
  }
  return out;
}
function rsiS(closes, period){
  const out = new Array(closes.length).fill(null);
  if(closes.length <= period) return out;
  let gain=0, loss=0;
  for(let i=1;i<=period;i++){
    const d = closes[i]-closes[i-1];
    if(d>=0) gain+=d; else loss-=d;
  }
  gain/=period; loss/=period;
  out[period] = loss===0 ? 100 : 100-100/(1+gain/loss);
  for(let i=period+1;i<closes.length;i++){
    const d = closes[i]-closes[i-1];
    gain = (gain*(period-1) + Math.max(d,0))/period;
    loss = (loss*(period-1) + Math.max(-d,0))/period;
    out[i] = loss===0 ? 100 : 100-100/(1+gain/loss);
  }
  return out;
}
function atrS(cs, period){
  const out = new Array(cs.length).fill(null);
  if(cs.length <= period) return out;
  const tr = [0];
  for(let i=1;i<cs.length;i++){
    const c=cs[i], p=cs[i-1];
    tr.push(Math.max(c.h-c.l, Math.abs(c.h-p.c), Math.abs(c.l-p.c)));
  }
  let a = 0;
  for(let i=1;i<=period;i++) a += tr[i];
  a /= period;
  out[period] = a;
  for(let i=period+1;i<cs.length;i++){
    a = (a*(period-1)+tr[i])/period;
    out[i] = a;
  }
  return out;
}
function prep(cs){
  const closes = cs.map(c=>c.c);
  return {cs, closes, e20:emaS(closes,20), e50:emaS(closes,50), e200:emaS(closes,200), rsi:rsiS(closes,14), atr:atrS(cs,14)};
}

/* Strategy: bumili sa pullback habang paakyat ang trend */
function evalAt(P, i){
  const cs=P.cs, close=P.closes[i], c=cs[i];
  const e20=P.e20[i], e50=P.e50[i], e200=P.e200[i], rsi=P.rsi[i], atr=P.atr[i];
  const up   = close>e50 && e50>e200 && e50>P.e50[i-5];
  const down = close<e50 && e50<e200;
  let lowMin=Infinity, rsiMin=100;
  for(let k=i-7;k<=i;k++){ lowMin=Math.min(lowMin, cs[k].l); rsiMin=Math.min(rsiMin, P.rsi[k]); }
  const touched    = lowMin <= e20*1.002;
  const recovering = rsiMin<=45 && rsi>P.rsi[i-1] && rsi>=45 && rsi<=65;
  const bullish    = c.c>c.o && close>e20;
  const extended   = rsi>=70 || (close-e20) > 2*atr;
  const buy = up && touched && recovering && bullish && !extended;
  return {up, down, touched, recovering, bullish, extended, buy, e20, e50, e200, rsi, atr};
}
function levelsAt(P, i, entry){
  const atr = P.atr[i];
  let swing = Infinity;
  for(let k=i-9;k<=i;k++) swing = Math.min(swing, P.cs[k].l);
  let sl = Math.min(swing, entry-1.5*atr);
  sl = Math.max(sl, entry-3*atr);
  if(!(sl < entry)) sl = entry-1.5*atr;
  const tp = entry + 2*(entry-sl);
  return {sl, tp};
}
function decide(e, hold){
  if(!hold){
    if(e.buy) return "BUY";
    if(e.down) return "AVOID";
    return "WAIT";
  }
  if(e.down) return "SELL";
  if(e.up) return "HOLD";
  return "WATCH";
}
function backtest(cs, budget){
  const P = prep(cs);
  const trades = [];
  const FEE = 0.001;
  let i = 200;
  while(i < cs.length-2){
    const e = evalAt(P, i);
    if(!e.buy){ i++; continue; }
    const entry = cs[i+1].o;
    const lv = levelsAt(P, i, entry);
    const risk = entry - lv.sl;
    let R=null, exitPrice=null, j=i+1;
    const last = Math.min(i+100, cs.length-1);
    for(; j<=last; j++){
      const c = cs[j];
      if(c.l <= lv.sl){ R=-1; exitPrice=lv.sl; break; }
      if(c.h >= lv.tp){ R=2;  exitPrice=lv.tp; break; }
    }
    if(R===null){
      if(i+100 > cs.length-1) break;            // bukas pa ang trade pagdating ng dulo ng data
      exitPrice = cs[i+100].c;
      R = (exitPrice-entry)/risk;
      j = i+100;
    }
    R -= (entry*FEE + exitPrice*FEE)/risk;
    trades.push({R});
    i = j+1;
  }
  const n = trades.length;
  const wins = trades.filter(t=>t.R>0).length;
  const totalR = trades.reduce((s,t)=>s+t.R,0);
  const days = Math.max(1, Math.round((cs[cs.length-1].t - cs[200].t)/86400000));
  return {n, wins, losses:n-wins, winRate: n? wins/n*100 : 0, totalR, money: totalR*budget*0.01, days};
}
/* ================= PURE END ================= */

/* ---------- Data ---------- */
async function getJSON(url){
  let timer;
  const timeout = new Promise((_,rej)=>{ timer = setTimeout(()=>rej(new Error("timeout")), 8000); });
  try{
    const r = await Promise.race([fetch(url), timeout]);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await Promise.race([r.json(), timeout]);
  }catch(e){
    throw new Error(e.message==="Failed to fetch" ? "naka-block / walang koneksyon" : e.message);
  }finally{ clearTimeout(timer); }
}
const SOURCES = [
  { name:"Kraken", run: async (b,tf)=>{
      const pair = (b==="BTC"?"XBT":b)+"USD";
      const iv = {"1h":60,"4h":240,"1d":1440}[tf];
      const j = await getJSON(`https://api.kraken.com/0/public/OHLC?pair=${pair}&interval=${iv}`);
      if(j.error && j.error.length) throw new Error(j.error[0]);
      const key = Object.keys(j.result).find(k=>k!=="last");
      return j.result[key].map(k=>({t:k[0]*1000,o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[6]}));
  }},
  { name:"Coinbase", run: async (b,tf)=>{
      const gran = {"1h":3600,"4h":21600,"1d":86400}[tf];
      const j = await getJSON(`https://api.exchange.coinbase.com/products/${b}-USD/candles?granularity=${gran}`);
      return j.map(k=>({t:k[0]*1000,o:+k[3],h:+k[2],l:+k[1],c:+k[4],v:+k[5]})).reverse();
  }},
  { name:"OKX", run: async (b,tf)=>{
      const bar = {"1h":"1H","4h":"4H","1d":"1D"}[tf];
      const j = await getJSON(`https://www.okx.com/api/v5/market/candles?instId=${b}-USDT&bar=${bar}&limit=300`);
      if(!j.data || !j.data.length) throw new Error(j.msg||"walang data");
      return j.data.map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]})).reverse();
  }},
  { name:"Bybit", run: async (b,tf)=>{
      const iv = {"1h":"60","4h":"240","1d":"D"}[tf];
      const j = await getJSON(`https://api.bybit.com/v5/market/kline?category=spot&symbol=${b}USDT&interval=${iv}&limit=1000`);
      if(!j.result || !j.result.list || !j.result.list.length) throw new Error(j.retMsg||"walang data");
      return j.result.list.map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]})).reverse();
  }},
  { name:"KuCoin", run: async (b,tf)=>{
      const type = {"1h":"1hour","4h":"4hour","1d":"1day"}[tf];
      const j = await getJSON(`https://api.kucoin.com/api/v1/market/candles?type=${type}&symbol=${b}-USDT`);
      if(!j.data || !j.data.length) throw new Error(j.msg||"walang data");
      return j.data.map(k=>({t:k[0]*1000,o:+k[1],c:+k[2],h:+k[3],l:+k[4],v:+k[5]})).reverse();
  }},
  { name:"Binance", run: async (b,tf)=>{
      let last;
      for(const h of ["https://data-api.binance.vision","https://api.binance.com"]){
        try{
          const j = await getJSON(`${h}/api/v3/klines?symbol=${b}USDT&interval=${tf}&limit=1000`);
          return j.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
        }catch(e){ last = e; }
      }
      throw last;
  }}
];

/* Sabay-sabay ang try; kapag may unang sumagot, maghihintay ng saglit
   at kukunin ang source na pinakamarami ang data. */
function fetchKlines(base, tf){
  return new Promise((resolve, reject)=>{
    const results = [], errors = [];
    let pending = SOURCES.length, timer = null;
    const finish = ()=>{
      clearTimeout(timer);
      results.sort((a,b)=>b.candles.length-a.candles.length);
      resolve(results[0]);
    };
    SOURCES.forEach(s=>{
      s.run(base, tf).then(candles=>{
        if(!candles || candles.length < 230) throw new Error("kulang ang data");
        results.push({candles, source:s.name});
        if(!timer) timer = setTimeout(finish, 1200);
      }).catch(e=>{
        errors.push(s.name+": "+e.message);
      }).finally(()=>{
        pending--;
        if(pending===0){
          if(results.length) finish();
          else reject(new Error("Walang makuhang data.<br><span class='small'>"+errors.join("<br>")+"</span>"));
        }
      });
    });
  });
}

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
function fmt(n){
  if(n==null || isNaN(n)) return "-";
  const a = Math.abs(n);
  const d = a>=1000?2 : a>=1?4 : 6;
  return Number(n).toLocaleString("en-US",{maximumFractionDigits:d});
}
function money(n){
  const s = Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?"-":"")+"$"+s;
}
const COINS = ["BTC","ETH","SOL","BNB","XRP","DOGE","ADA","AVAX","LINK","TON"];
const TF_LABEL = {"1h":"1 oras","4h":"4 na oras","1d":"1 araw"};
const HINTS = {
  trend:"Ang trend ay ang direksyon ng presyo sa mas mahabang panahon. Mas mataas ang tsansa kapag sumasabay ka sa paakyat na trend.",
  sl:"Ito ang presyong lalabas ka kapag bumaba ang coin, para hindi lumaki ang lugi. Ilagay ito bilang order sa exchange mo.",
  tp:"Ito ang presyong lalabas ka kapag tumaas ang coin, para makuha mo ang kita.",
  qty:"Kinalkula ito para 1% lang ng budget mo ang pwedeng mawala kung tumama ang presyo sa stop-loss."
};
function help(key){
  return `<button class="q" data-h="${key}" aria-label="Paliwanag">?</button>`;
}

/* ---------- State ---------- */
let state = null;

/* ---------- Check ---------- */
function reasonsFor(verdict, e, levelPrice){
  if(verdict==="BUY") return [
    "Paakyat ang trend ng coin.",
    "Bumaba nang konti ang presyo, magandang pasok.",
    "Bumabalik na ang lakas ng mga bumibili."
  ];
  if(verdict==="AVOID") return [
    "Pababa ang trend ng coin.",
    "Madalas na bumababa pa ito, kaya huwag munang bumili."
  ];
  if(verdict==="SELL") return [
    "Pababa na ang trend ng coin.",
    "Mas mabuting ibenta bago lumaki ang lugi."
  ];
  if(verdict==="HOLD") return [
    "Paakyat pa rin ang trend ng coin.",
    "Hawakan hangga't hindi bumababa sa $"+fmt(levelPrice)+"."
  ];
  if(verdict==="WATCH") return [
    "Walang malinaw na direksyon ang presyo.",
    "Bantayan. Kung bumaba sa $"+fmt(levelPrice)+", magandang magbenta na."
  ];
  // WAIT
  if(e.up && e.extended) return [
    "Paakyat ang trend, pero tumaas na nang malaki.",
    "Huwag humabol. Hintayin ang konting pagbaba."
  ];
  if(e.up && !e.touched) return [
    "Paakyat ang trend.",
    "Hindi pa bumababa ang presyo para sa magandang pasok."
  ];
  if(e.up) return [
    "Paakyat ang trend at bumaba na ang presyo.",
    "Hindi pa bumabalik ang lakas ng mga bumibili. Hintayin ang berdeng candle."
  ];
  return [
    "Walang malinaw na direksyon ang presyo.",
    "Mas ligtas na maghintay."
  ];
}

async function runCheck(){
  const coin = $("coin").value, tf = $("tf").value;
  const budget = parseFloat($("budget").value);
  const hold = $("hold").checked;
  const btn = $("go");
  if(!(budget > 0)){
    $("out").innerHTML = `<div class="card err">Maglagay ng budget na higit sa 0.</div>`;
    return;
  }
  saveSettings();
  btn.disabled = true; btn.textContent = "Kinukuha ang data...";
  $("out").innerHTML = "";
  try{
    const {candles, source} = await fetchKlines(coin, tf);
    const price = candles[candles.length-1].c;
    const closed = candles.slice(0,-1);          // ang huling candle ay hindi pa tapos
    const P = prep(closed);
    const i = closed.length-1;
    const e = evalAt(P, i);
    const verdict = decide(e, hold);
    state = {coin, tf, closed, budget};
    renderResult({coin, tf, budget, source, price, e, verdict, P, i, lastT: candles[candles.length-1].t});
  }catch(err){
    $("out").innerHTML = `<div class="card err">Hindi makuha ang data: ${err.message}<br><br><span class="small">Subukang lumipat sa ibang network (WiFi o mobile data) o i-off ang VPN.</span></div>`;
  }finally{
    btn.disabled = false; btn.textContent = "I-check";
  }
}

function renderResult(r){
  const {coin, tf, budget, source, price, e, verdict, P, i} = r;
  const V = {
    BUY:  {t:"🟢 PWEDENG BUMILI",     c:"GREEN",  s:"Maganda ang setup ngayon."},
    WAIT: {t:"🟡 MAGHINTAY MUNA",     c:"YELLOW", s:"Wala pang magandang pasok."},
    AVOID:{t:"🔴 HUWAG MUNANG BUMILI",c:"RED",    s:"Hindi maganda ang kalagayan ngayon."},
    SELL: {t:"🔴 MAGBENTA NA",        c:"RED",    s:"Sira na ang trend, mag-ingat."},
    HOLD: {t:"🟢 HAWAKAN MUNA",       c:"GREEN",  s:"Maayos pa ang takbo ng coin."},
    WATCH:{t:"🟡 BANTAYAN",           c:"YELLOW", s:"Walang malinaw na direksyon."}
  }[verdict];
  const trendTxt = e.up ? "⬆️ Paakyat" : e.down ? "⬇️ Pababa" : "↔️ Walang direksyon";
  const levelPrice = e.e50;

  let plan = "";
  let planData = null;
  if(verdict==="BUY"){
    const lv = levelsAt(P, i, price);
    const risk = price - lv.sl;
    const riskAmt = budget*0.01;
    let qty = riskAmt/risk;
    let cost = qty*price;
    let capped = false;
    if(cost > budget){ cost = budget; qty = budget/price; capped = true; }
    const loss = qty*risk, gain = qty*risk*2;
    planData = {coin, tf, entry:price, sl:lv.sl, tp:lv.tp, qty, cost};
    plan = `
      <div class="card">
        <h2>Plano mo</h2>
        <div class="grid">
          <div class="kv"><span>Presyo ng pagbili</span><strong>$${fmt(price)}</strong></div>
          <div class="kv"><span>Stop-loss ${help("sl")}</span><strong style="color:var(--sell)">$${fmt(lv.sl)}</strong></div>
          <div class="kv"><span>Take-profit ${help("tp")}</span><strong style="color:var(--buy)">$${fmt(lv.tp)}</strong></div>
          <div class="kv"><span>Ilan ang bibilhin ${help("qty")}</span><strong>${fmt(qty)} ${coin}</strong></div>
          <div class="kv"><span>Halaga</span><strong>${money(cost)}</strong></div>
          <div class="kv"><span>Pwedeng malugi</span><strong style="color:var(--sell)">${money(loss)}</strong></div>
          <div class="kv" style="grid-column:1/-1"><span>Posibleng kita</span><strong style="color:var(--buy)">${money(gain)}</strong></div>
        </div>
        <div id="hint-box"></div>
        ${capped?`<div class="small" style="margin-top:8px">Na-cap sa budget mo, kaya mas mababa ang pwedeng malugi kaysa 1%.</div>`:""}
        <button class="alt" id="saveTrade">💾 I-save ang trade</button>
      </div>`;
  }

  const holdLine = (verdict==="HOLD"||verdict==="WATCH")
    ? `<div class="price">Antas na babantayan: <b>$${fmt(levelPrice)}</b> (kapag bumaba dito, isipin nang magbenta)</div>` : "";

  const why = reasonsFor(verdict, e, levelPrice);
  $("out").innerHTML = `
    <div class="card verdict">
      <div class="small">${coin} · ${TF_LABEL[tf]}</div>
      <div class="big ${V.c}">${V.t}</div>
      <div class="sentence">${V.s}</div>
      <div class="chip">Trend: ${trendTxt} ${help("trend")}</div>
      <div class="price">Presyo ngayon: $${fmt(price)}</div>
      ${holdLine}
      <div id="hint-box-top"></div>
    </div>
    ${plan}
    <div class="card">
      <h2>Bakit?</h2>
      <ul class="why">${why.map(w=>`<li>${w}</li>`).join("")}</ul>
    </div>
    <div class="card">
      <button class="alt" id="runBt" style="margin-top:0">🧪 Subukan sa nakaraan</button>
      <div id="bt"></div>
    </div>
    <div class="small" style="text-align:center;margin-bottom:12px">Source: ${source} · huling candle: ${new Date(r.lastT).toLocaleString()}${source==="Coinbase"&&tf==="4h"?"<br>(Coinbase: 6 na oras ang candle na gamit)":""}</div>
  `;

  $("runBt").addEventListener("click", runBacktest);
  if(planData){
    $("saveTrade").addEventListener("click", ()=>{
      addTrade(planData);
      $("saveTrade").textContent = "✅ Na-save sa Mga Trade Ko";
      $("saveTrade").disabled = true;
    });
  }
}

function runBacktest(){
  if(!state) return;
  const btn = $("runBt");
  const r = backtest(state.closed, state.budget);
  let verdictLine, color;
  if(r.n < 10){ verdictLine = "Kakaunti ang trades, hindi pa sapat na batayan."; color = "YELLOW"; }
  else if(r.totalR > 0){ verdictLine = "Kumita sa nakaraan."; color = "GREEN"; }
  else { verdictLine = "Hindi kumita sa nakaraan. Mag-ingat sa coin na ito."; color = "RED"; }
  $("bt").innerHTML = `
    <div style="margin-top:12px">
      <div class="bt-big ${color}">${verdictLine}</div>
      <div class="grid">
        <div class="kv"><span>Ilang beses nag-signal</span><strong>${r.n}</strong></div>
        <div class="kv"><span>Panalo</span><strong>${r.wins} (${r.winRate.toFixed(0)}%)</strong></div>
        <div class="kv"><span>Talo</span><strong>${r.losses}</strong></div>
        <div class="kv"><span>Kabuuang resulta</span><strong style="color:var(--${r.money>=0?"buy":"sell"})">${r.money>=0?"+":""}${money(r.money)}</strong></div>
      </div>
      <div class="small" style="margin-top:8px">Sinubukan sa huling ${r.days} araw ng ${state.coin} (${TF_LABEL[state.tf]}). Kung ang budget mo ay ${money(state.budget)} at 1% ang risk sa bawat trade. Kasama na ang bayad na 0.1% sa bawat bili at benta. Hindi ito garantiya ng mangyayari sa hinaharap.</div>
    </div>`;
  btn.textContent = "🧪 Ulitin ang pagsubok";
}

/* ---------- Journal ---------- */
function loadJ(){
  try{ const j = JSON.parse(localStorage.getItem("th_journal")||"[]"); return Array.isArray(j)?j:[]; }catch(e){ return []; }
}
function saveJ(j){
  try{ localStorage.setItem("th_journal", JSON.stringify(j)); }catch(e){}
}
function addTrade(p){
  const j = loadJ();
  j.unshift({id:Date.now(), coin:p.coin, tf:p.tf, entry:p.entry, sl:p.sl, tp:p.tp, qty:p.qty, cost:p.cost, time:Date.now(), status:"open"});
  saveJ(j);
  renderJournal({});
}
function renderJournal(prices){
  const j = loadJ();
  const box = $("journal");
  if(!j.length){
    box.innerHTML = `<div class="small">Wala pang naka-save. Kapag may "PWEDENG BUMILI", pindutin ang "I-save ang trade" para masubaybayan dito.</div>`;
    return;
  }
  box.innerHTML = j.map(t=>{
    if(!COINS.includes(t.coin)) return "";
    let tag, line;
    if(t.status==="tp"){
      tag = `<span class="tag GREEN">✅ Naabot ang take-profit</span>`;
      line = `Kita: <b class="GREEN">+${money((t.tp-t.entry)*t.qty)}</b>`;
    } else if(t.status==="sl"){
      tag = `<span class="tag RED">❌ Tumama sa stop-loss</span>`;
      line = `Lugi: <b class="RED">${money((t.sl-t.entry)*t.qty)}</b>`;
    } else {
      tag = `<span class="tag YELLOW">⏳ Bukas pa</span>`;
      const cur = prices[t.coin];
      line = cur ? `Ngayon: $${fmt(cur)} · <b class="${cur>=t.entry?"GREEN":"RED"}">${money((cur-t.entry)*t.qty)}</b>` : `I-refresh para makita ang presyo ngayon.`;
    }
    return `<div class="trade">
      <div class="top"><span>${t.coin} · ${TF_LABEL[t.tf]||""}</span>${tag}</div>
      <div class="small" style="margin-top:6px">Bili: $${fmt(t.entry)} · Stop-loss: $${fmt(t.sl)} · Take-profit: $${fmt(t.tp)}</div>
      <div class="small">${fmt(t.qty)} ${t.coin} · ${money(t.cost)} · ${new Date(t.time).toLocaleString()}</div>
      <div style="margin-top:6px;font-size:14px">${line}</div>
      <button class="del" data-del="${t.id}">Tanggalin</button>
    </div>`;
  }).join("");
}

/* Binabantayan ang mga bukas na trade gamit ang 1-oras na candles */
let checking = false;
async function checkJournal(){
  if(checking) return;
  const j = loadJ();
  const open = j.filter(t=>t.status==="open" && COINS.includes(t.coin));
  if(!open.length){ renderJournal({}); return; }
  checking = true;
  const btn = $("refresh"); btn.disabled = true; btn.textContent = "Sinusuri...";
  const prices = {}, closedNow = [], failed = [];
  const coins = [...new Set(open.map(t=>t.coin))];
  for(const coin of coins){
    try{
      const {candles} = await fetchKlines(coin, "1h");
      prices[coin] = candles[candles.length-1].c;
      for(const t of open.filter(x=>x.coin===coin)){
        for(const c of candles){
          if(c.t <= t.time) continue;
          if(c.l <= t.sl){ t.status="sl"; t.closeTime=c.t; closedNow.push(t); break; }
          if(c.h >= t.tp){ t.status="tp"; t.closeTime=c.t; closedNow.push(t); break; }
        }
      }
    }catch(e){ failed.push(coin); }
  }
  saveJ(j);
  renderJournal(prices);
  const n = $("notice");
  if(closedNow.length){
    n.innerHTML = `<div class="notice">🔔 May na-abot sa mga trade mo:<br>` + closedNow.map(t=>
      `${t.coin}: ${t.status==="tp"?"✅ naabot ang take-profit":"❌ tumama sa stop-loss"}`).join("<br>") + `</div>`;
  } else { n.innerHTML = ""; }
  if(failed.length) $("journal").insertAdjacentHTML("afterbegin", `<div class="small err" style="margin-bottom:8px">Hindi ma-check ang ${failed.join(", ")}. Subukan ulit mamaya.</div>`);
  btn.disabled = false; btn.textContent = "I-refresh ang mga trade";
  checking = false;
}

/* ---------- Events ---------- */
function saveSettings(){
  try{ localStorage.setItem("th_settings", JSON.stringify({c:$("coin").value,t:$("tf").value,b:$("budget").value,h:$("hold").checked})); }catch(e){}
}
function loadSettings(){
  try{
    const d = JSON.parse(localStorage.getItem("th_settings")||"null");
    if(!d) return;
    if(COINS.includes(d.c)) $("coin").value = d.c;
    if(TF_LABEL[d.t]) $("tf").value = d.t;
    if(d.b) $("budget").value = d.b;
    $("hold").checked = !!d.h;
  }catch(e){}
}
document.addEventListener("click", ev=>{
  const q = ev.target.closest(".q");
  if(q){
    const key = q.getAttribute("data-h");
    const card = q.closest(".card");
    let box = card.querySelector(".hint");
    if(box && box.getAttribute("data-k")===key){ box.remove(); return; }
    if(box) box.remove();
    card.insertAdjacentHTML("beforeend", `<div class="hint" data-k="${key}">${HINTS[key]}</div>`);
    return;
  }
  const del = ev.target.closest("[data-del]");
  if(del){
    const id = Number(del.getAttribute("data-del"));
    saveJ(loadJ().filter(t=>t.id!==id));
    renderJournal({});
  }
});
$("go").addEventListener("click", runCheck);
$("refresh").addEventListener("click", checkJournal);
loadSettings();
renderJournal({});
checkJournal();
</script>
